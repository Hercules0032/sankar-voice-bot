<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sonkor Voice Bot</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-800 rounded-3xl p-6 shadow-2xl border border-slate-700">
        <h2 class="text-xl font-bold text-center mb-6 text-blue-400">Sonkor AI Assistant</h2>
        
        <div id="chat" class="h-80 overflow-y-auto mb-6 p-4 bg-slate-900 rounded-xl space-y-4">
            </div>

        <div class="flex flex-col items-center gap-4">
            <button id="mic" class="w-20 h-20 bg-red-500 rounded-full flex items-center justify-center text-3xl shadow-lg transition-transform active:scale-90">🎤</button>
            <p id="status" class="text-sm text-slate-400">Tap to start speaking</p>
        </div>
    </div>

    <script>
        let mediaRecorder;
        let chunks = [];
        const btn = document.getElementById('mic');
        const status = document.getElementById('status');

        btn.onclick = async () => {
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                btn.classList.remove('bg-green-500', 'animate-pulse');
                btn.classList.add('bg-red-500');
                return;
            }

            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            mediaRecorder.ondataavailable = e => chunks.push(e.data);
            mediaRecorder.onstop = async () => {
                const blob = new Blob(chunks, { type: 'audio/wav' });
                const form = new FormData();
                form.append('file', blob);
                
                status.innerText = "Processing...";
                const res = await fetch('/chat', { method: 'POST', body: form });
                const data = await res.json();

                appendMsg('User', data.user_text);
                appendMsg('Bot', data.bot_text);
                new Audio(data.audio_url).play();
                
                status.innerText = "Tap to speak";
                chunks = [];
            };

            chunks = [];
            mediaRecorder.start();
            btn.classList.remove('bg-red-500');
            btn.classList.add('bg-green-500', 'animate-pulse');
            status.innerText = "Listening...";
        };

        function appendMsg(who, text) {
            const div = document.createElement('div');
            div.className = who === 'User' ? 'text-right' : 'text-left';
            div.innerHTML = `<span class="inline-block px-4 py-2 rounded-2xl ${who === 'User' ? 'bg-blue-600' : 'bg-slate-700'}">${text}</span>`;
            document.getElementById('chat').appendChild(div);
            document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
        }
    </script>
</body>
</html>
